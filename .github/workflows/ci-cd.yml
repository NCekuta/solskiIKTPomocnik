name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint backend (Ruff)
        run: ruff check backend
      - name: Lint frontend (djLint)
        run: djlint frontend/templates --lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip  # predpomnjenje odvisnosti (pip cache)
      - run: pip install -r requirements.txt
      - name: Prevedi backend
        run: python -m compileall -q backend/app
      - name: Preveri, da se aplikacija ustvari
        working-directory: backend
        run: |
          python -c "from app import create_app; create_app({'SECRET_KEY': 'build'})"
      - name: Shrani paket aplikacije
        uses: actions/upload-artifact@v4
        with:
          name: aplikacija
          path: |
            backend/app
            backend/sql
            frontend
            requirements.txt
            railway.json
            !**/__pycache__

  test:
    runs-on: ubuntu-latest
    services:
      mysql:  # testna baza za čas izvajanja testov
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solski_ikt_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    env:
      SECRET_KEY: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: solski_ikt_test
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testi s pokritostjo kode
        run: pytest --cov=app --cov-report=term --cov-report=html
      - name: Shrani poročilo o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokritost-kode
          path: htmlcov

  deploy:
    # samo ob pushu na main in samo, če so lint, build in test uspeli
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prenesi paket aplikacije iz joba build
        uses: actions/download-artifact@v4
        with:
          name: aplikacija
      - run: npm install -g @railway/cli
      - name: Namesti na Railway
        run: railway up --ci --service aplikacija
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
